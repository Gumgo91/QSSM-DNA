[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qssm-dna"
version = "1.0.0"
description = "QSSM-DNA: a four-qubit quantum state-space model for DNA sequence pretraining and transfer"
readme = "README.md"
authors = [{name = "Hyunseung Kong"}]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "requests>=2.28",
]

[project.optional-dependencies]
analysis = ["matplotlib>=3.7"]
data = ["genomic-benchmarks"]
reference = ["pennylane>=0.38"]
test = ["pytest>=7.0"]

[project.scripts]
qssm-dna = "qssm_dna.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "core: quantum operations, readout, sequence semantics and gradients",
    "pipeline: data, training, checkpoint and experiment helpers",
]
